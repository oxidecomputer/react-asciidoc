name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.4.0)'
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm install
      - run: npm run tsc

  canary:
    # Same-repo PRs only: fork PRs can't reach the `production` environment
    # secrets or get an OIDC token, so publish (and this whole job) can't work.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm run build

      - name: Publish canary
        id: canary
        run: |
          SHA=$(git rev-parse --short HEAD)
          CANARY_VERSION="$(node -p "require('./package.json').version")-canary.${SHA}"
          npm version "$CANARY_VERSION" --no-git-tag-version
          npm publish --provenance --access public --tag canary
          echo "version=$CANARY_VERSION" >> "$GITHUB_OUTPUT"

      # Cosmetic: never fail the canary publish over a PR-body edit.
      - name: Update PR description with canary version
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.canary.outputs.version }}'
            const line = '**Canary:** `npm install @oxide/react-asciidoc@' + version + '`'
            const { owner, repo } = context.repo
            const pull_number = context.payload.pull_request.number
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number })
            const body = pr.body || ''
            const updated = /^\*\*Canary:\*\*/m.test(body)
              ? body.replace(/^\*\*Canary:\*\*.*$/m, line)
              : `${body}\n\n${line}`
            await github.rest.pulls.update({ owner, repo, pull_number, body: updated })

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm run build

      - name: Set version
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Publish to npm
        run: npm publish --provenance --access public --tag latest

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release v${{ inputs.version }} [skip ci]"
          git tag "v${{ inputs.version }}"
          git push origin main --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ inputs.version }}" --generate-notes
